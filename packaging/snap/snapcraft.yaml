name: hotspot-share
title: Hotspot Share
base: core22
version: '2.0.19'
summary: Ultra-fast local Wi-Fi file transfer & clipboard sync (AirDrop for Linux)
description: |
  Hotspot Share is the ultimate local Wi-Fi file sharing and bi-directional clipboard synchronization suite for Linux, Android, and iOS. Like AirDrop and Quick Share, it lets you seamlessly beam files, 4K videos, folders, code, text, and images between your Linux PC and any smartphone over high-speed local Wi-Fi — with zero cloud servers, zero account sign-ups, and zero phone apps to install.

  Simply connect your phone to your PC's Wi-Fi hotspot (or local network) and scan the pairing QR code with your mobile camera. The responsive web app opens instantly in your mobile browser, ready for direct, gigabit-grade peer-to-peer transfers.

  Key Features & Capabilities:
  • Blazing Wi-Fi 6 Speeds: Transfer gigabytes of data in seconds (up to 80+ MB/s) with pure local peer-to-peer streaming and zero cloud throttling.
  • Zero Phone App Required: Works out-of-the-box in Safari, Chrome, Firefox, Edge, and any modern mobile browser.
  • Bi-Directional Multimodal Clipboard: Copy text, URLs, or photos on your Linux desktop and paste them instantly on your phone — or send from your phone directly into your PC's system clipboard (Ctrl+V ready).
  • Full Directory & Folder Transfers: Send nested folder trees with automatic on-the-fly packaging and smart conflict resolution.
  • Resumable Chunked Transfers: Robust 8MB chunk streaming engine with RFC 206 range resume support. Large video and backup uploads never fail on network drops.
  • In-Browser Media Previews: Stream and preview high-res videos, audio recordings, and photos directly in the file explorer before downloading.
  • One-Click ZIP Generation: Download entire shared directories as structured ZIP archives on the fly.
  • Private, Secure & Local-First: 100% offline-capable. Encrypted PIN pairing prevents unauthorized access. Your data never touches third-party servers or the Internet.
  • Native Desktop Integration: Built with a lightweight WebKitGTK interface, GNOME desktop integration, and Nautilus file manager extensions.

icon: snap/gui/icon.png
license: GPL-3.0-or-later
contact: penguinatnight1@gmail.com
website: https://github.com/penguinatnight/hotspot-share
issues: https://github.com/penguinatnight/hotspot-share/issues
source-code: https://github.com/penguinatnight/hotspot-share

grade: stable
confinement: strict

apps:
  hotspot-share:
    command: bin/hotspot-share-gui
    extensions: [gnome]
    desktop: snap/gui/hotspot-share.desktop
    environment:
      LD_LIBRARY_PATH: "$SNAP/gnome-platform/usr/lib/$SNAPCRAFT_ARCH_TRIPLET:$SNAP/gnome-platform/usr/lib:$LD_LIBRARY_PATH"
      WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"
      GIO_USE_NETWORK_MONITOR: "base"
      NO_AT_BRIDGE: "1"
    plugs:
      - network
      - network-bind
      - network-status
      - network-observe
      - home
      - removable-media
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - unity7
      - network-manager

  cli:
    command: bin/hotspot-share
    plugs:
      - network
      - network-bind
      - home
      - removable-media
      - network-manager

parts:
  gui:
    plugin: nil
    source: gui
    build-packages:
      - gcc
      - pkg-config
      - libgtk-3-dev
      - libwebkit2gtk-4.1-dev
    override-build: |
      gcc -O2 -Wall -fstack-protector-strong -D_FORTIFY_SOURCE=2 -Wformat -Wformat-security -fPIE -pie -Wl,-z,relro,-z,now -Wl,-z,noexecstack gui.c -o hotspot-share-gui $(pkg-config --cflags --libs gtk+-3.0 webkit2gtk-4.1)
      install -d $SNAPCRAFT_PART_INSTALL/bin
      install -m 755 hotspot-share-gui $SNAPCRAFT_PART_INSTALL/bin/hotspot-share-gui

  desktop-assets:
    plugin: dump
    source: .
    organize:
      packaging/desktop/hotspot-share.desktop: usr/share/applications/hotspot-share.desktop
      packaging/appstream/org.yab.hotspotshare.metainfo.xml: usr/share/metainfo/org.yab.hotspotshare.metainfo.xml
      assets/icons/hicolor: usr/share/icons/hicolor
      web: usr/share/hotspot-share/web

  backend:
    plugin: python
    source: .
    build-packages:
      - python3-setuptools
      - python3-wheel
    stage-packages:
      - python3
      - wl-clipboard
      - xclip
