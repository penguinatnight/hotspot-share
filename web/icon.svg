<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c1e"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a1a1a6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Squircle Background -->
  <rect x="32" y="32" width="448" height="448" rx="105" ry="105" fill="url(#bg)" stroke="#2c2c2e" stroke-width="4" filter="url(#glow)"/>
  
  <!-- Wi-Fi Waves & Transfer Arrows -->
  <g transform="translate(256, 256)" stroke="url(#accent)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Upper Wi-Fi Arc -->
    <path d="M-120,-80 A160,160 0 0,1 120,-80" />
    <path d="M-75,-35 A100,100 0 0,1 75,-35" />
    <!-- Center Dot -->
    <circle cx="0" cy="10" r="12" fill="url(#accent)" stroke="none"/>
    <!-- Bi-directional transfer arrows -->
    <path d="M-60,75 L60,75 M30,45 L60,75 L30,105" stroke-width="20"/>
    <path d="M60,125 L-60,125 M-30,95 L-60,125 L-30,155" stroke-width="20"/>
  </g>
</svg>