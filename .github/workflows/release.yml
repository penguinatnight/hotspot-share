name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev debhelper dpkg-dev

      - name: Compile Native Binary
        run: make build

      - name: Build Debian (.deb) Package
        run: |
          dpkg-buildpackage -us -uc -b
          mkdir -p dist
          mv ../hotspot-share_*.deb dist/ || true

      - name: Build Snap Package
        uses: canonical/action-snapcraft@v2
        id: snapcraft

      - name: Copy Snap Artifact
        run: |
          mkdir -p dist
          cp *.snap dist/ 2>/dev/null || true

      - name: Publish to Canonical Snap Store
        if: env.SNAPCRAFT_STORE_CREDENTIALS != ''
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.snapcraft.outputs.snap }}
          release: candidate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          generate_release_notes: true
